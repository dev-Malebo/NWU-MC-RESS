<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Dashboard — FindMyRes</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: rgba(212, 175, 55, 0.25);
    --gold: #d4af37;
    --gold2: #b8962e;
    --text: #f5f0e6;
    --muted: #a89f8a;
    --ok: #4ade80;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 48px;
  }
  .shell { max-width: 980px; margin: 0 auto; }
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 { font-size: 1.3rem; font-weight: 700; color: var(--gold); }
  .brand .sub { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav a {
    color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600;
    padding: 8px 14px; border-radius: 8px; border: 1px solid transparent;
  }
  .nav a:hover { color: var(--gold); border-color: var(--border); }
  .nav a.here { color: #000; background: var(--gold); }
  .gate, .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .gate { max-width: 420px; }
  label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-top: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  input {
    width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: #0a0a0a; color: var(--text); font-size: 0.95rem; outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    background: var(--gold); color: #000; border: none; padding: 11px 18px; border-radius: 10px;
    font-weight: 700; cursor: pointer; font-size: 0.88rem; margin-top: 16px;
  }
  button:hover { background: var(--gold2); }
  button.secondary { background: transparent; color: var(--gold); border: 1px solid var(--border); margin-top: 0; }
  button.danger { background: #7f1d1d; color: #fff; }
  .hidden { display: none !important; }
  .err { color: var(--danger); margin-top: 10px; font-size: 0.85rem; }
  .who { font-size: 0.82rem; color: var(--muted); margin-bottom: 16px; padding: 10px 14px; background: rgba(212,175,55,0.08); border-radius: 10px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
  .stat .n { font-size: 1.6rem; font-weight: 800; color: var(--gold); }
  .stat .l { font-size: 0.7rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { background: transparent; color: var(--muted); border: 1px solid var(--border); margin: 0; }
  .tabs button.active { background: var(--gold); color: #000; border-color: var(--gold); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .status { font-size: 0.8rem; color: var(--muted); }
  .item { background: #0f0f0f; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .item .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .item .title { font-weight: 700; color: var(--gold); }
  .item .body { font-size: 0.9rem; margin: 8px 0; color: var(--text); white-space: pre-wrap; }
  footer { margin-top: 28px; text-align: center; font-size: 0.72rem; color: #555; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><img src="icons/favicon-192.png" alt="FindMyRes" style="width:42px;height:42px;border-radius:12px;object-fit:cover">
      <h1>FindMyRes</h1>
      <div class="sub">Admin Dashboard</div>
    </div>
    <nav class="nav">
      <a href="index.html">Site</a>
      <a href="admin.html">Reviews</a>
      <a class="here" href="dashboard.html">Dashboard</a>
      <a href="admin-listings.html">Listings</a>
      <a href="landlord.html">Landlord</a>
      <a href="map.html">Map</a>
    </nav>
  </div>

  <div id="gate" class="gate">
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:8px">Admin only. Sign in to manage feedback and reports.</p>
    <label for="email">Admin email</label>
    <input id="email" type="email" value="maleboneomahlatsi@gmail.com" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="Firebase password" autocomplete="current-password">
    <button type="button" id="unlockBtn">Enter dashboard</button>
    <p class="err hidden" id="gateErr"></p>
  </div>

  <div id="panel" class="hidden">
    <p class="who" id="who"></p>
    <div class="stats">
      <div class="stat"><div class="n" id="sReviews">—</div><div class="l">Reviews</div></div>
      <div class="stat"><div class="n" id="sFeedback">—</div><div class="l">Feedback</div></div>
      <div class="stat"><div class="n" id="sOpen">—</div><div class="l">Open</div></div>
      <div class="stat"><div class="n" id="sAvg">—</div><div class="l">Avg rating</div></div>
      <div class="stat"><div class="n" id="sReports">—</div><div class="l">Reports</div></div>
    </div>
    <div class="tabs">
      <button type="button" class="active" data-tab="feedback">Site feedback</button>
      <button type="button" data-tab="reviews">Reviews</button>
      <button type="button" data-tab="locations">Location reports</button>
    </div>
    <div class="toolbar">
      <button type="button" class="secondary" id="refreshBtn">Refresh</button>
      <button type="button" class="secondary" id="signOutBtn">Sign out</button>
      <span class="status" id="status"></span>
    </div>
    <div id="list"></div>
  </div>
  <footer>FindMyRes Admin</footer>
</div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD7QHVH5hT0eURqXsJ0EXO_-BXUge5Iq_M",
    authDomain: "nwu-residences-81b8b.firebaseapp.com",
    projectId: "nwu-residences-81b8b",
    storageBucket: "nwu-residences-81b8b.firebasestorage.app",
    messagingSenderId: "979946386540",
    appId: "1:979946386540:web:da1c423bdf9be046445449",
    measurementId: "G-T1MY4MEC4J"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const ADMIN_EMAIL = "maleboneomahlatsi@gmail.com";

  let currentTab = "feedback";
  let feedbackRows = [], reviewRows = [], reportRows = [];

  const gate = document.getElementById("gate");
  const panel = document.getElementById("panel");
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const gateErr = document.getElementById("gateErr");

  function esc(s) { return String(s || "").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">"); }
  function showPanel(user) {
    gate.classList.add("hidden"); panel.classList.remove("hidden");
    document.getElementById("who").textContent = "Signed in as " + (user.email || "");
    loadAll();
  }
  function showGate(msg) {
    panel.classList.add("hidden"); gate.classList.remove("hidden");
    if (msg) { gateErr.textContent = msg; gateErr.classList.remove("hidden"); }
    else gateErr.classList.add("hidden");
  }

  document.getElementById("unlockBtn").onclick = async () => {
    const email = (document.getElementById("email").value || "").trim();
    const password = document.getElementById("pw").value;
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      if ((cred.user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        await auth.signOut(); showGate("Not the admin account."); return;
      }
      showPanel(cred.user);
    } catch (e) { showGate(e.message || "Sign-in failed"); }
  };
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("unlockBtn").click(); });
  document.getElementById("signOutBtn").onclick = async () => { await auth.signOut(); showGate(); };
  document.getElementById("refreshBtn").onclick = loadAll;

  document.querySelectorAll(".tabs button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentTab = btn.getAttribute("data-tab");
      renderList();
    };
  });
  auth.onAuthStateChanged(user => { if (user && (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase()) showPanel(user); });

  async function loadAll() {
    status.textContent = "Loading…";
    try {
      const emptySnap = { forEach() {}, empty: true, size: 0 };
      const [fbSnap, revSnap, repSnap] = await Promise.all([
        db.collection("site_feedback").orderBy("createdAt", "desc").limit(100).get().catch(() => emptySnap),
        db.collection("reviews").orderBy("createdAt", "desc").limit(200).get().catch(() => emptySnap),
        db.collection("location_reports").orderBy("createdAt", "desc").limit(200).get().catch(() => null)
      ]);
      reportRows = []; if (repSnap) repSnap.forEach(doc => reportRows.push({ id: doc.id, ...doc.data() }));
      document.getElementById("sReports").textContent = repSnap ? reportRows.filter(x => x.status !== "done").length : "n/a";
      feedbackRows = []; fbSnap.forEach(doc => feedbackRows.push({ id: doc.id, ...doc.data() }));
      reviewRows = []; let sum = 0, rc = 0;
      revSnap.forEach(doc => { const d = doc.data(); reviewRows.push({ id: doc.id, ...d }); if (d.rating) { sum += Number(d.rating); rc++; } });
      document.getElementById("sReviews").textContent = reviewRows.length;
      document.getElementById("sFeedback").textContent = feedbackRows.length;
      document.getElementById("sOpen").textContent = feedbackRows.filter(f => f.status !== "done").length;
      document.getElementById("sAvg").textContent = rc ? (sum / rc).toFixed(1) : "—";
      status.textContent = "Updated " + new Date().toLocaleTimeString();
      renderList();
    } catch (e) { status.textContent = "Error: " + e.message; }
  }

  function when(ts) { return ts && ts.toDate ? ts.toDate().toLocaleString() : ""; }
  const TYPE_LABEL = { pin: "Pin wrong", distance: "Distance wrong", address: "Name/address wrong", other: "Other" };

  function renderList() {
    list.innerHTML = "";
    if (currentTab === "locations") {
      if (!reportRows.length) { list.innerHTML = "<p class='status'>No location reports yet.</p>"; return; }
      reportRows.forEach(r => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<div class="meta">${esc(TYPE_LABEL[r.type] || r.type)} · ${esc(when(r.createdAt))} · ${r.status || "open"}</div>
          <div class="title">${esc(r.residenceName)}</div>
          <div class="body">${esc(r.address || "")}${r.note ? "\n" + esc(r.note) : ""}</div>
          <button type="button" class="danger del" style="margin-top:8px">Delete</button>`;
        div.querySelector(".del").onclick = async () => { if (confirm("Delete?")) { await db.collection("location_reports").doc(r.id).delete(); loadAll(); } };
        list.appendChild(div);
      });
      return;
    }
    if (currentTab === "feedback") {
      if (!feedbackRows.length) { list.innerHTML = "<p class='status'>No feedback yet.</p>"; return; }
      feedbackRows.forEach(f => {
        const div = document.createElement("div"); div.className = "item";
        const done = f.status === "done";
        div.innerHTML = `<div class="meta">${esc(f.type || "feedback")} · ${esc(when(f.createdAt))} · ${done ? "done" : "open"}</div>
          <div class="title">${esc(f.name || "Anonymous")}${f.contact ? " · " + esc(f.contact) : ""}</div>
          <div class="body">${esc(f.message || "")}</div>
          <div style="display:flex;gap:8px;margin-top:8px">
            ${done ? "" : '<button type="button" class="secondary mark">Mark done</button>'}
            <button type="button" class="danger del">Delete</button>
          </div>`;
        const mark = div.querySelector(".mark");
        if (mark) mark.onclick = async () => { await db.collection("site_feedback").doc(f.id).update({ status: "done" }); loadAll(); };
        div.querySelector(".del").onclick = async () => { if (confirm("Delete?")) { await db.collection("site_feedback").doc(f.id).delete(); loadAll(); } };
        list.appendChild(div);
      });
    } else {
      if (!reviewRows.length) { list.innerHTML = "<p class='status'>No reviews yet.</p>"; return; }
      reviewRows.forEach(r => {
        const stars = r.rating ? ("★".repeat(r.rating) + "☆".repeat(5 - r.rating)) : "—";
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<div class="meta">${stars} · ${esc(r.author || "Student")} · ${esc(when(r.createdAt))}</div>
          <div class="title">${esc(r.residenceName)}</div>
          <div class="body">${esc(r.comment || "(rating only)")}</div>
          <button type="button" class="danger del" style="margin-top:8px">Delete</button>`;
        div.querySelector(".del").onclick = async () => { if (confirm("Delete?")) { await db.collection("reviews").doc(r.id).delete(); loadAll(); } };
        list.appendChild(div);
      });
    }
  }
</script>
</body>
</html>

  <div class="rbtns" style="margin-top:14px">
    <button type="button" class="rb" id="rCancel">Cancel</button>

</form>

  map.on('locationfound', e => {
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker(e.latlng, { radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map);
  });
  map.on('locationerror', () => toast('Could not get your location. Check location permission.'));

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'legend');
    d.innerHTML = '<strong>Drive from campus</strong><br><i style="background:#22c55e"></i>≤ 3 km<br><i style="background:#eab308"></i>3–6 km<br><i style="background:#f97316"></i>6–10 km<br><i style="background:#ef4444"></i>&gt; 10 km<br><i style="background:#8b5cf6"></i>Estimate only<br><span style="font-size:.75rem;color:#666">Blue ring = verified spot · Teal ring = street-level (within a few hundred metres) · others = approximate area</span>';
    return d;
  };
  legend.addTo(map);

  /* ---------- Markers ---------- */
  function pinColor(km) {
    if (km == null) return '#8b5cf6';
    if (km <= 3) return '#22c55e';
    if (km <= 6) return '#eab308';
    if (km <= 10) return '#f97316';
    return '#ef4444';
  }
  function makeIcon(r, selected) {
    let ring = r.exact ? 'box-shadow:0 0 0 3px #fff,0 0 0 5px #2563eb;' : (r._street ? 'box-shadow:0 0 0 3px #fff,0 0 0 5px #14b8a6;' : 'box-shadow:0 1px 4px rgba(0,0,0,.4);');
    if (selected) ring = 'box-shadow:0 0 0 3px #fff,0 0 0 7px #f97316;';
    const size = selected ? 18 : 14;
    return L.divIcon({ className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2],
      html: `<div style="background:${pinColor(r.km)};width:${size}px;height:${size}px;border-radius:50%;border:2px solid #fff;${ring}"></div>` });
  }
  function popupHtml(r) {
    const dest = r.exact ? (r.lat + ',' + r.lon) : ((r.address || r.name) + ', Mahikeng, South Africa');
    const url = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent('North-West University Mahikeng Campus, Mmabatho') + '&destination=' + encodeURIComponent(dest);
    const km = r.km != null ? `<p><strong>${r.km} km</strong> drive from campus</p>` : '<p>Tap directions for exact distance</p>';
    const tag = r.exact ? '<span class="tag ok">✔ Verified location</span>' : (r._street ? '<span class="tag st">≈ Street-level location</span>' : '<span class="tag">≈ Approximate pin</span>');
    return `<div class="popup"><h3>${esc(r.name)}</h3><p>${esc(r.area)}</p><p>${esc(r.address)}</p>${km}${tag}
      <div class="row"><a class="dir" href="${url}" target="_blank" rel="noopener">🗺️ Directions</a>
      <button type="button" class="rep" data-i="${r._i}">⚑ Wrong spot?</button></div></div>`;
  }

  const cluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 45, showCoverageOnHover: false }).addTo(map);

  function buildMarker(r) {
    r._m = L.marker([r.lat, r.lon], { icon: makeIcon(r), title: r.name, alt: r.name });
    r._m.bindPopup(() => popupHtml(r), { maxWidth: 260 });
  }

  /* ---------- Corrections (pin-fixes.json) ---------- */
  let fixes = {};
  function applyFix(r, f) {
    r.lat = f.lat; r.lon = f.lon;
    if ('km' in f) r.km = f.km;
    r._suspect = false;
    if (f.precision === 'street') { r.exact = false; r._fixed = false; r._street = true; }
    else if (f.precision === 'approx') { r.exact = false; r._fixed = false; r._street = false; }
    else { r.exact = true; r._fixed = true; r._street = false; }
  }
  function haversine(a, b, c, d) {
    const p = Math.PI / 180, x = Math.sin((c - a) * p / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin((d - b) * p / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(x));
  }
  async function loadFixes() {
    let remote = {}, local = {};
    try { const res = await fetch('pin-fixes.json', { cache: 'no-cache' }); if (res.ok) remote = await res.json(); } catch (e) {}
    if (EDIT) { try { local = JSON.parse(localStorage.getItem(FIX_KEY) || '{}'); } catch (e) {} }
    return Object.assign({}, remote, local);
  }

  /* ---------- Filtering & search ---------- */
  let band = 'all', query = '', editing = null;
  function inBand(r) {
    if (band === 'all') return true;
    if (r.km == null) return false;
    if (band === '3') return r.km <= 3;
    if (band === '6') return r.km > 3 && r.km <= 6;
    if (band === '10') return r.km > 6 && r.km <= 10;
    return r.km > 10;
  }
  function applyFilters() {
    const list = RESIDENCES.filter(r => r !== editing && inBand(r) && (!query || r._hay.includes(query)));
    cluster.clearLayers();
    cluster.addLayers(list.map(r => r._m));
    $('count').textContent = list.length + ' of ' + RESIDENCES.length;
    return list;
  }
  let st;
  $('search').addEventListener('input', e => { clearTimeout(st); st = setTimeout(() => { query = e.target.value.trim().toLowerCase(); applyFilters(); }, 150); });
  $('search').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    query = e.target.value.trim().toLowerCase();
    const list = applyFilters();
    if (list.length === 1) { map.setView([list[0].lat, list[0].lon], 17); list[0]._m.openPopup(); }
    else if (list.length > 1 && list.length <= 80) map.fitBounds(L.latLngBounds(list.map(r => [r.lat, r.lon])).pad(0.2));
    else if (!list.length) toast('No residence matches that.');
    e.target.blur();
  });
  $('bar').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    band = b.dataset.band;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
    applyFilters();
  });

  /* ---------- Report a wrong location ---------- */
  const FB_CONFIG = {
    apiKey: "AIzaSyD7QHVH5hT0eURqXsJ0EXO_-BXUge5Iq_M", authDomain: "nwu-residences-81b8b.firebaseapp.com",
    projectId: "nwu-residences-81b8b", storageBucket: "nwu-residences-81b8b.firebasestorage.app",
    messagingSenderId: "979946386540", appId: "1:979946386540:web:da1c423bdf9be046445449", measurementId: "G-T1MY4MEC4J"
  };
  let fbP = null;
  const loadScript = src => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
  function getFb() {
    if (!fbP) fbP = (async () => {
      const b = 'https://www.gstatic.com/firebasejs/10.14.1/';
      await loadScript(b + 'firebase-app-compat.js');
      await Promise.all([loadScript(b + 'firebase-firestore-compat.js'), loadScript(b + 'firebase-auth-compat.js')]);
      if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      const auth = firebase.auth();
      if (!auth.currentUser) await auth.signInAnonymously();
      return { db: firebase.firestore(), uid: auth.currentUser.uid };
    })().catch(e => { fbP = null; throw e; });
    return fbP;
  }

  let repR = null, repSug = null, picking = false, pickMarker = null;
  const showSheet = on => { $('rBack').style.display = on ? 'block' : 'none'; $('rSheet').style.display = on ? 'block' : 'none'; };
  function setSug(lat, lon, acc, how) {
    repSug = { lat, lon, acc: acc || null };
    $('rSug').textContent = '✔ Spot saved' + (how ? ' (' + how + ')' : '') + ': ' + lat.toFixed(5) + ', ' + lon.toFixed(5);
    if (pickMarker) map.removeLayer(pickMarker);
    pickMarker = L.circleMarker([lat, lon], { radius: 9, color: '#fff', weight: 3, fillColor: '#f97316', fillOpacity: 1 }).addTo(map);
  }
  function openReport(r) {
    repR = r; repSug = null;
    if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; }
    $('rName').textContent = r.name; $('rAddr').textContent = r.address || r.area || '';
    $('rNote').value = ''; $('rContact').value = ''; $('rWeb').value = ''; $('rType').value = 'pin'; $('rSug').textContent = '';
    showSheet(true);
    getFb().catch(() => {});
  }
  map.on('popupopen', e => {
    const b = e.popup.getElement() && e.popup.getElement().querySelector('.rep');
    if (b) b.onclick = () => { map.closePopup(); openReport(RESIDENCES[+b.dataset.i]); };
  });
  $('rCancel').onclick = $('rBack').onclick = () => { showSheet(false); if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; } };
  $('rUse').onclick = () => {
    if (!navigator.geolocation) { toast('Location is not available on this device.'); return; }
    $('rSug').textContent = 'Getting your location…';
    navigator.geolocation.getCurrentPosition(
      p => setSug(p.coords.latitude, p.coords.longitude, p.coords.accuracy, '±' + Math.round(p.coords.accuracy) + ' m'),
      () => { $('rSug').textContent = ''; toast('Could not get your location. Try "Tap on the map".'); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  };
  $('rPick').onclick = () => {
    picking = true; showSheet(false); $('pickBanner').style.display = 'flex';
    map.flyTo([repR.lat, repR.lon], Math.max(map.getZoom(), 17));
    if (!map.hasLayer(satellite)) { map.removeLayer(streets); satellite.addTo(map); }
  };
  $('pickCancel').onclick = () => { picking = false; $('pickBanner').style.display = 'none'; showSheet(true); };
  map.on('click', e => {
    if (!picking) return;
    picking = false; $('pickBanner').style.display = 'none';
    setSug(e.latlng.lat, e.latlng.lng, null, 'from map'); showSheet(true);
  });
  $('rSheet').addEventListener('submit', async e => {
    e.preventDefault();
    if ($('rWeb').value) return; // honeypot
    const note = $('rNote').value.trim();
    if (!repSug && !note) { toast('Show us the right spot or add a note.'); return; }
    if (Date.now() - (+localStorage.getItem('nwuLastReport') || 0) < 15000) { toast('Please wait a few seconds between reports.'); return; }
    const btn = $('rSend'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const { db, uid } = await getFb();
      const r = repR, safe = keyOf(r).replace(/[\/#?[\]]/g, '_').slice(0, 100);
      await db.collection('location_reports').doc(uid + '__' + safe).set({
        residenceName: r.name, address: r.address || '', area: r.area || '', key: keyOf(r),
        currentLat: r.lat, currentLon: r.lon, currentKm: r.km == null ? null : r.km, wasVerified: !!r.exact,
        suggestedLat: repSug ? +repSug.lat.toFixed(6) : null, suggestedLon: repSug ? +repSug.lon.toFixed(6) : null,
        accuracyM: repSug && repSug.acc ? Math.round(repSug.acc) : null,
        type: $('rType').value, note: note.slice(0, 500), contact: $('rContact').value.trim().slice(0, 100) || null,
        source: 'map', status: 'open', userId: uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      try { localStorage.setItem('nwuLastReport', String(Date.now())); } catch (x) {}
      showSheet(false); if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; }
      toast('Thanks! Your report was sent. 💜', 4000);
    } catch (err) {
      console.error(err);
      toast('Could not send. Check your connection and try again.', 4500);
    }
    btn.disabled = false; btn.textContent = 'Send report';
  });

  /* ---------- Boot ---------- */
  loadFixes().then(f => {
    fixes = f;
    RESIDENCES.forEach(r => {
      const x = fixes[keyOf(r)];
      if (x) applyFix(r, x);
      else { const s = haversine(CAMPUS[0], CAMPUS[1], r.lat, r.lon); r._suspect = !r.exact && r.km != null && (s > r.km + 0.5 || r.km > 2.2 * s + 1.5); }
      buildMarker(r);
    });
    applyFilters();
    if (EDIT) initEditor();
  });

  /* ---------- Pin editor (map.html?edit=1) ---------- */
  function initEditor() {
    const box = document.createElement('div');
    box.id = 'edit';
    box.innerHTML = `
      <div id="editHead"><b>📌 Pin fixer <span id="eProg"></span></b><button type="button" id="eCollapse">–</button></div>
      <div id="editBody">
        <div class="erow">
          <select id="eFilter"><option value="sus">Likely wrong first</option><option value="todo">Not fixed yet</option><option value="fixed">Fixed</option><option value="all">All</option></select>
          <input type="search" id="eSearch" placeholder="Search…">
        </div>
        <div id="eList"></div>
        <div id="eDetail"><span class="a">Pick a residence from the list.</span></div>
        <div class="erow"><button type="button" class="ebtn sec" id="eExport">⬇ Export fixes</button><button type="button" class="ebtn sec" id="eReset">Reset mine</button></div>
      </div>`;
    document.body.appendChild(box);
    $('eCollapse').onclick = () => box.classList.toggle('collapsed');

    let sel = null, pending = null, visible = [], editMarker = null;
    const msg = (t, cls) => { const e = $('eMsg'); if (e) { e.textContent = t; e.className = cls || ''; } };
    const inRange = (la, lo) => la < -25.6 && la > -26.1 && lo > 25.3 && lo < 25.9;

    function renderList() {
      const mode = $('eFilter').value, q = $('eSearch').value.trim().toLowerCase();
      visible = RESIDENCES.filter(r => {
        if (q && !r._hay.includes(q)) return false;
        if (mode === 'fixed') return r._fixed;
        if (mode === 'todo') return !r._fixed;
        if (mode === 'sus') return !r._fixed && r._suspect;
        return true;
      });
      const L2 = $('eList'); L2.innerHTML = '';
      visible.forEach(r => {
        const d = document.createElement('div');
        d.className = 'eitem' + (r === sel ? ' on' : '');
        d.innerHTML = `<span class="dot ${r._fixed ? 'fixed' : (r._suspect ? 'sus' : '')}"></span><div>${esc(r.name)}<small>${esc(r.address || r.area)}</small></div>`;
        d.onclick = () => select(r);
        L2.appendChild(d);
      });
      if (!visible.length) L2.innerHTML = '<div class="eitem"><small>Nothing in this filter 🎉</small></div>';
      $('eProg').textContent = '· ' + RESIDENCES.filter(r => r._fixed).length + '/' + RESIDENCES.length + ' fixed';
    }

    function deselect() {
      if (editMarker) { map.removeLayer(editMarker); editMarker = null; }
      editing = null; sel = null; applyFilters();
    }
    function select(r) {
      if (editMarker) { map.removeLayer(editMarker); editMarker = null; }
      sel = r; editing = r; pending = { lat: r.lat, lon: r.lon };
      applyFilters();
      editMarker = L.marker([r.lat, r.lon], { draggable: true, icon: makeIcon(r, true), zIndexOffset: 2000 }).addTo(map);
      editMarker.on('dragend', () => {
        const p = editMarker.getLatLng(); pending = { lat: p.lat, lon: p.lng };
        $('eCoords').value = p.lat.toFixed(6) + ', ' + p.lng.toFixed(6);
        msg('Pin moved. Press Save when it is on the right building.');
      });
      map.flyTo([r.lat, r.lon], Math.max(map.getZoom(), 17));
      const g = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((r.address || r.name) + ', Mahikeng, South Africa');
      $('eDetail').innerHTML = `
        <div class="t">${esc(r.name)}</div>
        <div class="a">${esc(r.address)}${r.km != null ? ' · ' + r.km + ' km' : ''}</div>
        <div class="erow" style="padding:0 0 6px"><a href="${g}" target="_blank" rel="noopener" class="ebtn sec" style="text-decoration:none">🔎 Find in Google Maps</a><button type="button" class="ebtn sec" id="eAuto">Auto-locate</button></div>
        <div class="erow" style="padding:0 0 6px"><input type="text" id="eCoords" placeholder="Paste lat, lon from Google Maps"><button type="button" class="ebtn sec" id="eSet">Set</button></div>
        <div class="erow" style="padding:0"><label style="flex:1"><input type="checkbox" id="eKm" checked> Update driving km</label><button type="button" class="ebtn ok" id="eSave">Save &amp; next</button></div>
        <div id="eMsg">Drag the orange pin, tap the map, or paste coordinates.</div>`;
      $('eCoords').value = r.lat.toFixed(6) + ', ' + r.lon.toFixed(6);
      $('eSet').onclick = setFromInput;
      $('eCoords').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setFromInput(); } });
      $('eAuto').onclick = autoLocate;
      $('eSave').onclick = save;
      renderList();
    }
    function moveTo(lat, lon, note) {
      if (!sel) return;
      if (!inRange(lat, lon)) { msg("That's outside Mahikeng. Did lat/lon get swapped?", 'bad'); return; }
      pending = { lat, lon }; editMarker.setLatLng([lat, lon]);
      $('eCoords').value = lat.toFixed(6) + ', ' + lon.toFixed(6);
      map.panTo([lat, lon]);
      msg(note || 'Pin placed. Check it on satellite, then Save.', 'good');
    }
    function setFromInput() {
      const m = $('eCoords').value.match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
      if (!m) { msg('Could not read that. Format: -25.8412, 25.6071', 'bad'); return; }
      moveTo(parseFloat(m[1]), parseFloat(m[2]));
    }
    async function autoLocate() {
      const btn = $('eAuto'); btn.disabled = true; msg('Searching OpenStreetMap…');
      const clean = (sel.address || '').replace(/\s+/g, ' ').trim();
      const num = (clean.match(/^\d+/) || [''])[0];
      const street = (clean.match(/\b([A-Za-z' ]+(?:Street|Str|Drive|Road|Crescent|Close|Avenue|Ave|Way))\b/i) || [])[1];
      const tries = [clean + ', South Africa'];
      if (street) tries.push((num + ' ' + street + ' ' + (sel.area || '') + ' Mahikeng').trim(), street + ' Mahikeng');
      for (const q of tries) {
        try {
          const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=25.45,-25.75,25.80,-26.00&bounded=1&q=' + encodeURIComponent(q));
          const j = await res.json();
          if (j.length) { btn.disabled = false; moveTo(parseFloat(j[0].lat), parseFloat(j[0].lon), 'Best guess: ' + j[0].display_name.slice(0, 80) + '. Street-level only, confirm on satellite.'); return; }
        } catch (e) {}
        await new Promise(r => setTimeout(r, 1100));
      }
      btn.disabled = false;
      msg('OpenStreetMap does not know this address. Use "Find in Google Maps", right-click the spot, copy the coordinates, paste them here.', 'bad');
    }
    async function drivingKm(lat, lon) {
      try {
        const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${CAMPUS[1]},${CAMPUS[0]};${lon},${lat}?overview=false`, { signal: ctl.signal });
        clearTimeout(t);
        const j = await res.json();
        if (j.routes && j.routes[0]) return Math.round(j.routes[0].distance / 100) / 10;
      } catch (e) {}
      return null;
    }
    async function save() {
      if (!sel || !pending) return;
      const btn = $('eSave'); btn.disabled = true;
      const f = { lat: +pending.lat.toFixed(6), lon: +pending.lon.toFixed(6) };
      if ($('eKm').checked) { msg('Calculating driving distance…'); const km = await drivingKm(f.lat, f.lon); if (km != null) f.km = km; }
      fixes[keyOf(sel)] = f;
      try { localStorage.setItem(FIX_KEY, JSON.stringify(fixes)); } catch (e) {}
      const r = sel;
      applyFix(r, f);
      r._m.setLatLng([r.lat, r.lon]); r._m.setIcon(makeIcon(r));
      deselect(); renderList();
      const next = visible.find(x => !x._fixed);
      if (next) select(next); else $('eDetail').innerHTML = '<span class="a">All done in this filter 🎉 Export your fixes.</span>';
    }

    map.on('click', e => { if (sel && !picking) moveTo(e.latlng.lat, e.latlng.lng, 'Pin placed where you tapped. Check it, then Save.'); });
    $('eFilter').onchange = renderList;
    $('eSearch').oninput = renderList;
    $('eExport').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(fixes, null, 1)], { type: 'application/json' }));
      a.download = 'pin-fixes.json'; a.click();
      alert('Saved pin-fixes.json. Upload it to GitHub next to map.html and the public map will use it.');
    };
    $('eReset').onclick = () => { if (confirm('Clear all fixes saved in THIS browser? (Fixes already published in pin-fixes.json stay.)')) { localStorage.removeItem(FIX_KEY); location.reload(); } };
    renderList();

    // Open straight to a reported residence: map.html?edit=1&fix=<key>&lat=..&lon=..
    const p = new URLSearchParams(location.search), fk = p.get('fix');
    if (fk) {
      const r = RESIDENCES.find(x => keyOf(x) === fk);
      if (r) {
        select(r);
        const la = parseFloat(p.get('lat')), lo = parseFloat(p.get('lon'));
        if (isFinite(la) && isFinite(lo)) moveTo(la, lo, 'Pin placed at the reported spot. Check on satellite, then Save.');
      }
    }
  }
}
</script>
</body>
</html>

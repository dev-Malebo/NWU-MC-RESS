<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Admin — FindMyRes</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/favicon-512.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #0a0a0a; --card: #141414; --border: rgba(212,175,55,0.25);
    --gold: #d4af37; --gold2: #b8962e; --text: #f5f0e6; --muted: #a89f8a;
    --ok: #4ade80; --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px 48px; }
  .shell { max-width: 980px; margin: 0 auto; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 40px; height: 40px; border-radius: 8px; }
  .brand h1 { font-size: 1.3rem; font-weight: 700; color: var(--gold); }
  .brand .sub { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid transparent; }
  .nav a:hover { color: var(--gold); border-color: var(--border); }
  .nav a.here { color: #000; background: var(--gold); }
  .gate { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 420px; }
  label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-top: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  input { width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0a0a0a; color: var(--text); font-size: 0.95rem; outline: none; }
  input:focus { border-color: var(--gold); }
  button { background: var(--gold); color: #000; border: none; padding: 11px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.88rem; margin-top: 16px; }
  button:hover { background: var(--gold2); }
  button.secondary { background: transparent; color: var(--gold); border: 1px solid var(--border); margin-top: 0; }
  button.danger { background: #7f1d1d; color: #fff; }
  .hidden { display: none !important; }
  .err { color: var(--danger); margin-top: 10px; font-size: 0.85rem; }
  .who { font-size: 0.82rem; color: var(--muted); margin-bottom: 16px; padding: 10px 14px; background: rgba(212,175,55,0.08); border-radius: 10px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .status { font-size: 0.8rem; color: var(--muted); }
  .review { background: #0f0f0f; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .review .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .review .res { font-weight: 700; color: var(--gold); }
  .review .body { font-size: 0.9rem; margin: 8px 0; color: var(--text); }
  footer { margin-top: 28px; text-align: center; font-size: 0.72rem; color: #555; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <img src="icons/favicon-192.png" alt="FindMyRes">
      <div>
        <h1>FindMyRes</h1>
        <div class="sub">Review Admin</div>
      </div>
    </div>
    <nav class="nav">
      <a href="index.html">Site</a>
      <a class="here" href="admin.html">Reviews</a>
      <a href="admin-listings.html">Listings</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="landlord.html">Landlord</a>
      <a href="map.html">Map</a>
    </nav>
  </div>

  <div id="gate" class="gate">
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:8px">Sign in with your admin Firebase account.</p>
    <label for="email">Admin email</label>
    <input id="email" type="email" value="maleboneomahlatsi@gmail.com" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="Firebase password" autocomplete="current-password">
    <button type="button" id="unlockBtn">Unlock</button>
    <p class="err hidden" id="gateErr"></p>
  </div>

  <div id="panel" class="hidden">
    <p class="who" id="who"></p>
    <div class="toolbar">
      <button type="button" class="secondary" id="refreshBtn">Refresh</button>
      <button type="button" class="secondary" id="signOutBtn">Sign out</button>
      <span class="status" id="status">Loading…</span>
    </div>
    <div id="list"></div>
  </div>
  <footer>FindMyRes Admin</footer>
</div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD7QHVH5hT0eURqXsJ0EXO_-BXUge5Iq_M",
    authDomain: "nwu-residences-81b8b.firebaseapp.com",
    projectId: "nwu-residences-81b8b",
    storageBucket: "nwu-residences-81b8b.firebasestorage.app",
    messagingSenderId: "979946386540",
    appId: "1:979946386540:web:da1c423bdf9be046445449",
    measurementId: "G-T1MY4MEC4J"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const ADMIN_EMAIL = "maleboneomahlatsi@gmail.com";

  const gate = document.getElementById("gate");
  const panel = document.getElementById("panel");
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const gateErr = document.getElementById("gateErr");
  const who = document.getElementById("who");

  function showPanel(user) {
    gate.classList.add("hidden"); panel.classList.remove("hidden");
    who.textContent = "Signed in as " + (user.email || user.uid);
    loadReviews();
  }
  function showGate(msg) {
    panel.classList.add("hidden"); gate.classList.remove("hidden");
    if (msg) { gateErr.textContent = msg; gateErr.classList.remove("hidden"); }
    else gateErr.classList.add("hidden");
  }

  document.getElementById("unlockBtn").onclick = async () => {
    const email = (document.getElementById("email").value || "").trim();
    const password = document.getElementById("pw").value;
    gateErr.classList.add("hidden");
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      if ((cred.user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        await auth.signOut(); showGate("Not the admin account."); return;
      }
      showPanel(cred.user);
    } catch (err) { showGate(err.message || "Sign-in failed"); }
  };
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("unlockBtn").click(); });
  document.getElementById("refreshBtn").onclick = loadReviews;
  document.getElementById("signOutBtn").onclick = async () => { await auth.signOut(); showGate(); };
  auth.onAuthStateChanged(user => { if (user && (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase()) showPanel(user); });

  function esc(s) { return String(s || "").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">"); }

  async function loadReviews() {
    status.textContent = "Loading…"; list.innerHTML = "";
    try {
      const snap = await db.collection("reviews").orderBy("createdAt", "desc").limit(200).get();
      if (snap.empty) { status.textContent = "No reviews yet."; return; }
      status.textContent = snap.size + " review(s)";
      snap.forEach(doc => {
        const d = doc.data();
        const when = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toLocaleString() : "";
        const stars = d.rating ? ("★".repeat(d.rating) + "☆".repeat(5 - d.rating)) : "—";
        const div = document.createElement("div");
        div.className = "review";
        div.innerHTML = `
          <div class="meta"><span class="res">${esc(d.residenceName)}</span> · ${stars} · ${esc(d.author || "Student")} · ${esc(when)}</div>
          <div class="body">${esc(d.comment || "(rating only)")}</div>
          <button type="button" class="danger del" data-id="${doc.id}">Delete</button>
        `;
        div.querySelector(".del").onclick = async () => {
          if (!confirm("Delete this review?")) return;
          try { await db.collection("reviews").doc(doc.id).delete(); loadReviews(); }
          catch (err) { alert("Delete failed: " + err.message); }
        };
        list.appendChild(div);
      });
    } catch (err) { status.textContent = "Error: " + err.message; }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a14">
<title>Admin — NWU Residences</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>

  :root {
    --bg: #0c0a14;
    --bg2: #14101f;
    --card: rgba(255,255,255,0.05);
    --card-border: rgba(167,139,250,0.18);
    --text: #f3eefc;
    --muted: #a89bc4;
    --purple: #8b5cf6;
    --purple2: #6b46c0;
    --pink: #c084fc;
    --danger: #f87171;
    --ok: #34d399;
    --glass: blur(16px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(139,92,246,0.35), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(192,132,252,0.2), transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 48px;
  }
  .shell { max-width: 980px; margin: 0 auto; }
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 22px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(135deg, #6b46c0, #c084fc);
    display: grid; place-items: center; font-weight: 800; font-size: 0.85rem;
    box-shadow: 0 8px 24px rgba(107,70,192,0.45);
  }
  .brand h1 {
    font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff, #c4b5fd);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .sub { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .nav {
    display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--card-border);
    padding: 5px; border-radius: 999px; backdrop-filter: var(--glass);
  }
  .nav a {
    color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; transition: 0.15s;
  }
  .nav a:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .nav a.here {
    color: #fff; background: linear-gradient(135deg, #6b46c0, #8b5cf6);
    box-shadow: 0 4px 14px rgba(107,70,192,0.4);
  }
  .gate, .panel-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 24px;
    backdrop-filter: var(--glass);
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .gate { max-width: 420px; }
  .gate label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-top: 12px; letter-spacing: 0.02em; text-transform: uppercase; }
  .gate input, .search-input {
    width: 100%;
    margin-top: 6px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(167,139,250,0.25);
    background: rgba(0,0,0,0.25);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
  }
  .gate input:focus, .search-input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
  }
  button {
    background: linear-gradient(135deg, #6b46c0, #8b5cf6);
    color: #fff; border: none; padding: 11px 18px; border-radius: 12px;
    font-weight: 700; cursor: pointer; font-size: 0.88rem;
    box-shadow: 0 6px 18px rgba(107,70,192,0.35);
    transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.secondary {
    background: rgba(255,255,255,0.08);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.1);
  }
  button.danger {
    background: linear-gradient(135deg, #dc2626, #f87171);
    box-shadow: 0 6px 16px rgba(220,38,38,0.3);
  }
  button.ghost {
    background: transparent; box-shadow: none;
    border: 1px solid rgba(167,139,250,0.3); color: #ddd6fe;
  }
  .hidden { display: none !important; }
  .err { color: var(--danger); margin-top: 10px; font-size: 0.85rem; }
  .who {
    font-size: 0.82rem; color: var(--muted); margin-bottom: 14px;
    padding: 10px 14px; border-radius: 12px;
    background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.2);
  }
  .who strong { color: #e9d5ff; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .status { font-size: 0.82rem; color: var(--muted); }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 18px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 18px 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute; inset: 0 auto auto 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--purple), transparent);
  }
  .stat .n {
    font-size: 1.7rem; font-weight: 800;
    background: linear-gradient(135deg, #c4b5fd, #fff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat .l { font-size: 0.72rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button {
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    box-shadow: none;
    border: 1px solid transparent;
  }
  .tabs button.active {
    color: #fff;
    background: linear-gradient(135deg, #6b46c0, #8b5cf6);
    border-color: transparent;
    box-shadow: 0 6px 16px rgba(107,70,192,0.35);
  }
  .review, .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 16px 14px;
    margin-bottom: 10px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .review:hover, .card:hover {
    border-color: rgba(167,139,250,0.4);
    transform: translateY(-1px);
  }
  .review .meta, .card .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  .review .res, .card .title { font-weight: 700; color: #ede9fe; font-size: 1rem; }
  .review .body, .card .body { font-size: 0.92rem; margin: 8px 0; color: #d4c8ef; line-height: 1.45; }
  .badge {
    display: inline-block; font-size: 0.68rem; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; margin-left: 6px;
  }
  .badge.open { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .badge.done { background: rgba(52,211,153,0.15); color: #34d399; }
  .stars-gold { color: #fbbf24; letter-spacing: 1px; }
  footer.foot {
    margin-top: 28px; text-align: center; font-size: 0.72rem; color: #6b5b8c;
  }

  #unlockBtn { margin-top: 16px; width: 100%; }
  .review .del { margin-top: 10px; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="logo">PA</div>
      <div>
        <h1>Review Admin</h1>
        <div class="sub">Moderate student reviews · Purple Army</div>
      </div>
    </div>
    <nav class="nav">
      <a href="index.html">Site</a>
      <a class="here" href="admin.html">Reviews</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="map.html">Map</a>
    </nav>
  </div>

  <div id="gate" class="gate">
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:4px">Sign in with your admin Firebase account.</p>
    <label for="email">Admin email</label>
    <input id="email" type="email" value="maleboneomahlatsi@gmail.com" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="Firebase user password" autocomplete="current-password">
    <button type="button" id="unlockBtn">Unlock console</button>
    <p class="err hidden" id="gateErr"></p>
  </div>

  <div id="panel" class="hidden">
    <p class="who" id="who"></p>
    <div class="toolbar">
      <button type="button" id="refreshBtn">Refresh</button>
      <button type="button" class="secondary" id="signOutBtn">Sign out</button>
      <span class="status" id="status">Loading…</span>
    </div>
    <div id="list"></div>
  </div>

  <footer class="foot">Admin tools · not linked from the public site</footer>
</div>
<script>

  const firebaseConfig = {
    apiKey: "AIzaSyD7QHVH5hT0eURqXsJ0EXO_-BXUge5Iq_M",
    authDomain: "nwu-residences-81b8b.firebaseapp.com",
    projectId: "nwu-residences-81b8b",
    storageBucket: "nwu-residences-81b8b.firebasestorage.app",
    messagingSenderId: "979946386540",
    appId: "1:979946386540:web:da1c423bdf9be046445449",
    measurementId: "G-T1MY4MEC4J"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const ADMIN_EMAIL = "maleboneomahlatsi@gmail.com";

  const gate = document.getElementById("gate");
  const panel = document.getElementById("panel");
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const gateErr = document.getElementById("gateErr");
  const who = document.getElementById("who");

  function showPanel(user) {
    gate.classList.add("hidden");
    panel.classList.remove("hidden");
    who.textContent = "Signed in as " + (user.email || user.uid);
    loadReviews();
  }

  function showGate(msg) {
    panel.classList.add("hidden");
    gate.classList.remove("hidden");
    if (msg) {
      gateErr.textContent = msg;
      gateErr.classList.remove("hidden");
    } else {
      gateErr.classList.add("hidden");
    }
  }

  document.getElementById("unlockBtn").onclick = async () => {
    const email = (document.getElementById("email").value || "").trim();
    const password = document.getElementById("pw").value;
    gateErr.classList.add("hidden");
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      if ((cred.user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        await auth.signOut();
        showGate("This account is not the admin email in your Firestore rules.");
        return;
      }
      showPanel(cred.user);
    } catch (err) {
      console.error(err);
      showGate(err.message || "Sign-in failed");
    }
  };

  document.getElementById("pw").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("unlockBtn").click();
  });

  document.getElementById("refreshBtn").onclick = loadReviews;
  document.getElementById("signOutBtn").onclick = async () => {
    await auth.signOut();
    showGate();
  };

  auth.onAuthStateChanged(user => {
    if (user && (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
      showPanel(user);
    }
  });

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  async function loadReviews() {
    status.textContent = "Loading…";
    list.innerHTML = "";
    try {
      const snap = await db.collection("reviews").orderBy("createdAt", "desc").limit(200).get();
      if (snap.empty) {
        status.textContent = "No reviews yet.";
        return;
      }
      status.textContent = snap.size + " review(s)";
      snap.forEach(doc => {
        const d = doc.data();
        const when = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toLocaleString() : "";
        const stars = d.rating ? ("★".repeat(d.rating) + "☆".repeat(5 - d.rating)) : "—";
        const div = document.createElement("div");
        div.className = "review";
        div.innerHTML = `
          <div class="meta"><span class="res">${esc(d.residenceName)}</span> · ${stars} · ${esc(d.author || "Student")} · ${esc(when)}</div>
          <div class="body">${esc(d.comment || "(rating only)")}</div>
          <button type="button" class="del" data-id="${doc.id}">Delete</button>
        `;
        div.querySelector(".del").onclick = async () => {
          if (!confirm("Delete this review?")) return;
          try {
            await db.collection("reviews").doc(doc.id).delete();
            loadReviews();
          } catch (err) {
            alert("Delete failed: " + err.message);
          }
        };
        list.appendChild(div);
      });
    } catch (err) {
      console.error(err);
      status.textContent = "Error loading: " + err.message;
    }
  }

</script>
</body>
</html>

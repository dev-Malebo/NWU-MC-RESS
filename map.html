const map = L.map('map').setView(CAMPUS, 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 19
}).addTo(map);

// Campus marker
const campusIcon = L.divIcon({
  className: '',
  html: '<div style="background:#2d1f54;color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4)">🎓</div>',
  iconSize: [28, 28],
  iconAnchor: [14, 14]
});
L.marker(CAMPUS, { icon: campusIcon })
  .addTo(map)
  .bindPopup('<div class="popup"><h3>NWU Mahikeng Campus</h3><p>Origin for all distances</p></div>');

const markers = [];
const layer = L.layerGroup().addTo(map);

function pinColor(km) {
  if (km == null) return '#8b5cf6';
  if (km <= 3) return '#22c55e';
  if (km <= 6) return '#eab308';
  if (km <= 10) return '#f97316';
  return '#ef4444';
}

function addMarker(r) {
  const color = pinColor(r.km);
  const icon = L.divIcon({
    className: '',
    html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });
  const dest = encodeURIComponent((r.address || r.name) + ', Mahikeng, South Africa');
  const origin = encodeURIComponent('North-West University Mahikeng Campus, Mmabatho');
  const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}`;
  const kmText = r.km != null ? `<p><strong>${r.km} km</strong> drive from campus</p>` : '<p>Tap directions for exact distance</p>';
  const popup = `<div class="popup">
    <h3>${escapeHtml(r.name)}</h3>
    <p>${escapeHtml(r.area || '')}</p>
    <p>${escapeHtml(r.address || '')}</p>
    ${kmText}
    <a href="${mapsUrl}" target="_blank" rel="noopener">🗺️ Get Directions</a>
  </div>`;
  const m = L.marker([r.lat, r.lon], { icon }).bindPopup(popup);
  m._resName = (r.name || '').toLowerCase();
  markers.push(m);
  layer.addLayer(m);
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

RESIDENCES.forEach(addMarker);

const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <strong>Distance from campus</strong><br>
    <i style="background:#22c55e"></i> ≤ 3 km<br>
    <i style="background:#eab308"></i> 3–6 km<br>
    <i style="background:#f97316"></i> 6–10 km<br>
    <i style="background:#ef4444"></i> > 10 km<br>
    <i style="background:#8b5cf6"></i> Estimate only<br>
    <span style="font-size:0.75rem;color:#666">Pins show suburb area only · use Get Directions for exact street</span>
  `;
  return div;
};
legend.addTo(map);

document.getElementById('search').addEventListener('input', function(e) {
  const q = e.target.value.trim().toLowerCase();
  markers.forEach(m => {
    if (!q || m._resName.includes(q)) {
      if (!layer.hasLayer(m)) layer.addLayer(m);
    } else {
      layer.removeLayer(m);
    }
  });
});
</script>

<body>
<header>
  <h1>FindMyRes Map</h1>
  <input type="search" class="search-box" id="search" placeholder="Search name, street or suburb…" aria-label="Search residences" autocomplete="off">
  <a class="back" href="index.html">← Back to list</a>
</header>
<div class="bar" id="bar" role="group" aria-label="Filter by distance">
  <button type="button" class="chip on" data-band="all">All</button>
  <button type="button" class="chip" data-band="3"><i style="background:#22c55e"></i>≤ 3 km</button>
  <button type="button" class="chip" data-band="6"><i style="background:#eab308"></i>3–6 km</button>
  <button type="button" class="chip" data-band="10"><i style="background:#f97316"></i>6–10 km</button>
  <button type="button" class="chip" data-band="10+"><i style="background:#ef4444"></i>&gt; 10 km</button>
  <span id="count"></span>
</div>
<div id="map" role="application" aria-label="Map of residences"></div>

<div id="pickBanner"><span>Tap the exact spot on the map</span><button type="button" id="pickCancel">Cancel</button></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="rBack"></div>
<form id="rSheet" autocomplete="off">
  <h2>Report a wrong location</h2>
  <p class="sub"><b id="rName"></b><br><span id="rAddr"></span></p>
  <label for="rType">What's wrong?</label>
  <select id="rType">
    <option value="pin">The pin is in the wrong place</option>
    <option value="distance">The distance looks wrong</option>
    <option value="address">The name or address is wrong</option>
    <option value="other">Something else</option>
  </select>
  <label>Show us the right spot (best)</label>
  <div class="rbtns">
    <button type="button" class="rb" id="rUse">📡 I'm here now</button>
    <button type="button" class="rb" id="rPick">👆 Tap on the map</button>
  </div>
  <div id="rSug"></div>
  <label for="rNote">Notes (e.g. "behind the shop, blue gate")</label>
  <textarea id="rNote" maxlength="500"></textarea>
  <label for="rContact">WhatsApp / email (optional)</label>
  <input type="text" id="rContact" maxlength="100">
  <div class="hp" aria-hidden="true"><label>Website <input type="text" id="rWeb" tabindex="-1" autocomplete="off"></label></div>
  <div class="rbtns" style="margin-top:14px">
    <button type="button" class="rb" id="rCancel">Cancel</button>
    <button type="submit" class="rb go" id="rSend">Send report</button>
  </div>
</form>

    box.id = 'edit';
    box.innerHTML = `
      <div id="editHead"><b>📌 Pin fixer <span id="eProg"></span></b><button type="button" id="eCollapse">–</button></div>
      <div id="editBody">
        <div class="erow">
          <select id="eFilter"><option value="sus">Likely wrong first</option><option value="todo">Not fixed yet</option><option value="fixed">Fixed</option><option value="all">All</option></select>
          <input type="search" id="eSearch" placeholder="Search…">
        </div>
        <div id="eList"></div>
        <div id="eDetail"><span class="a">Pick a residence from the list.</span></div>
        <div class="erow"><button type="button" class="ebtn sec" id="eExport">⬇ Export fixes</button><button type="button" class="ebtn sec" id="eReset">Reset mine</button></div>
      </div>`;
    document.body.appendChild(box);
    $('eCollapse').onclick = () => box.classList.toggle('collapsed');

    let sel = null, pending = null, visible = [], editMarker = null;
    const msg = (t, cls) => { const e = $('eMsg'); if (e) { e.textContent = t; e.className = cls || ''; } };
    const inRange = (la, lo) => la < -25.6 && la > -26.1 && lo > 25.3 && lo < 25.9;

    function renderList() {
      const mode = $('eFilter').value, q = $('eSearch').value.trim().toLowerCase();
      visible = RESIDENCES.filter(r => {
        if (q && !r._hay.includes(q)) return false;
        if (mode === 'fixed') return r._fixed;
        if (mode === 'todo') return !r._fixed;
        if (mode === 'sus') return !r._fixed && r._suspect;
        return true;
      });
      const L2 = $('eList'); L2.innerHTML = '';
      visible.forEach(r => {
        const d = document.createElement('div');
        d.className = 'eitem' + (r === sel ? ' on' : '');
        d.innerHTML = `<span class="dot ${r._fixed ? 'fixed' : (r._suspect ? 'sus' : '')}"></span><div>${esc(r.name)}<small>${esc(r.address || r.area)}</small></div>`;
        d.onclick = () => select(r);
        L2.appendChild(d);
      });
      if (!visible.length) L2.innerHTML = '<div class="eitem"><small>Nothing in this filter 🎉</small></div>';
      $('eProg').textContent = '· ' + RESIDENCES.filter(r => r._fixed).length + '/' + RESIDENCES.length + ' fixed';
    }

    function deselect() {
      if (editMarker) { map.removeLayer(editMarker); editMarker = null; }
      editing = null; sel = null; applyFilters();
    }
    function select(r) {
      if (editMarker) { map.removeLayer(editMarker); editMarker = null; }
      sel = r; editing = r; pending = { lat: r.lat, lon: r.lon };
      applyFilters();
      editMarker = L.marker([r.lat, r.lon], { draggable: true, icon: makeIcon(r, true), zIndexOffset: 2000 }).addTo(map);
      editMarker.on('dragend', () => {
        const p = editMarker.getLatLng(); pending = { lat: p.lat, lon: p.lng };
        $('eCoords').value = p.lat.toFixed(6) + ', ' + p.lng.toFixed(6);
        msg('Pin moved. Press Save when it is on the right building.');
      });
      map.flyTo([r.lat, r.lon], Math.max(map.getZoom(), 17));
      const g = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((r.address || r.name) + ', Mahikeng, South Africa');
      $('eDetail').innerHTML = `
        <div class="t">${esc(r.name)}</div>
        <div class="a">${esc(r.address)}${r.km != null ? ' · ' + r.km + ' km' : ''}</div>
        <div class="erow" style="padding:0 0 6px"><a href="${g}" target="_blank" rel="noopener" class="ebtn sec" style="text-decoration:none">🔎 Find in Google Maps</a><button type="button" class="ebtn sec" id="eAuto">Auto-locate</button></div>
        <div class="erow" style="padding:0 0 6px"><input type="text" id="eCoords" placeholder="Paste lat, lon from Google Maps"><button type="button" class="ebtn sec" id="eSet">Set</button></div>
        <div class="erow" style="padding:0"><label style="flex:1"><input type="checkbox" id="eKm" checked> Update driving km</label><button type="button" class="ebtn ok" id="eSave">Save &amp; next</button></div>
        <div id="eMsg">Drag the orange pin, tap the map, or paste coordinates.</div>`;
      $('eCoords').value = r.lat.toFixed(6) + ', ' + r.lon.toFixed(6);
      $('eSet').onclick = setFromInput;
      $('eCoords').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setFromInput(); } });
      $('eAuto').onclick = autoLocate;
      $('eSave').onclick = save;
      renderList();
    }
    function moveTo(lat, lon, note) {
      if (!sel) return;
      if (!inRange(lat, lon)) { msg("That's outside Mahikeng. Did lat/lon get swapped?", 'bad'); return; }
      pending = { lat, lon }; editMarker.setLatLng([lat, lon]);
      $('eCoords').value = lat.toFixed(6) + ', ' + lon.toFixed(6);
      map.panTo([lat, lon]);
      msg(note || 'Pin placed. Check it on satellite, then Save.', 'good');
    }
    function setFromInput() {
      const m = $('eCoords').value.match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
      if (!m) { msg('Could not read that. Format: -25.8412, 25.6071', 'bad'); return; }
      moveTo(parseFloat(m[1]), parseFloat(m[2]));
    }
    async function autoLocate() {
      const btn = $('eAuto'); btn.disabled = true; msg('Searching OpenStreetMap…');
      const clean = (sel.address || '').replace(/\s+/g, ' ').trim();
      const num = (clean.match(/^\d+/) || [''])[0];
      const street = (clean.match(/\b([A-Za-z' ]+(?:Street|Str|Drive|Road|Crescent|Close|Avenue|Ave|Way))\b/i) || [])[1];
      const tries = [clean + ', South Africa'];
      if (street) tries.push((num + ' ' + street + ' ' + (sel.area || '') + ' Mahikeng').trim(), street + ' Mahikeng');
      for (const q of tries) {
        try {
          const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=25.45,-25.75,25.80,-26.00&bounded=1&q=' + encodeURIComponent(q));
          const j = await res.json();
          if (j.length) { btn.disabled = false; moveTo(parseFloat(j[0].lat), parseFloat(j[0].lon), 'Best guess: ' + j[0].display_name.slice(0, 80) + '. Street-level only, confirm on satellite.'); return; }
        } catch (e) {}
        await new Promise(r => setTimeout(r, 1100));
      }
      btn.disabled = false;
      msg('OpenStreetMap does not know this address. Use "Find in Google Maps", right-click the spot, copy the coordinates, paste them here.', 'bad');
    }
    async function drivingKm(lat, lon) {
      try {
        const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${CAMPUS[1]},${CAMPUS[0]};${lon},${lat}?overview=false`, { signal: ctl.signal });
        clearTimeout(t);
        const j = await res.json();
        if (j.routes && j.routes[0]) return Math.round(j.routes[0].distance / 100) / 10;
      } catch (e) {}
      return null;
    }
    async function save() {
      if (!sel || !pending) return;
      const btn = $('eSave'); btn.disabled = true;
      const f = { lat: +pending.lat.toFixed(6), lon: +pending.lon.toFixed(6) };
      if ($('eKm').checked) { msg('Calculating driving distance…'); const km = await drivingKm(f.lat, f.lon); if (km != null) f.km = km; }
      fixes[keyOf(sel)] = f;
      try { localStorage.setItem(FIX_KEY, JSON.stringify(fixes)); } catch (e) {}
      const r = sel;
      applyFix(r, f);
      r._m.setLatLng([r.lat, r.lon]); r._m.setIcon(makeIcon(r));
      deselect(); renderList();
      const next = visible.find(x => !x._fixed);
      if (next) select(next); else $('eDetail').innerHTML = '<span class="a">All done in this filter 🎉 Export your fixes.</span>';
    }

    map.on('click', e => { if (sel && !picking) moveTo(e.latlng.lat, e.latlng.lng, 'Pin placed where you tapped. Check it, then Save.'); });
    $('eFilter').onchange = renderList;
    $('eSearch').oninput = renderList;
    $('eExport').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(fixes, null, 1)], { type: 'application/json' }));
      a.download = 'pin-fixes.json'; a.click();
      alert('Saved pin-fixes.json. Upload it to GitHub next to map.html and the public map will use it.');
    };
    $('eReset').onclick = () => { if (confirm('Clear all fixes saved in THIS browser? (Fixes already published in pin-fixes.json stay.)')) { localStorage.removeItem(FIX_KEY); location.reload(); } };
    renderList();

    // Open straight to a reported residence: map.html?edit=1&fix=<key>&lat=..&lon=..
    const p = new URLSearchParams(location.search), fk = p.get('fix');
    if (fk) {
      const r = RESIDENCES.find(x => keyOf(x) === fk);
      if (r) {
        select(r);
        const la = parseFloat(p.get('lat')), lo = parseFloat(p.get('lon'));
        if (isFinite(la) && isFinite(lo)) moveTo(la, lo, 'Pin placed at the reported spot. Check on satellite, then Save.');
      }
    }
  }
}
</script>
</body>
</html>
